# Nginx location blocks for SkillBridge Document Processing Service
# Add these two location blocks INSIDE your existing HTTPS server { ... } block
# that handles rtxsvr.tail59469f.ts.net

    # Document processing (async job submission)
    location /api/v1/documents/process {
        proxy_pass         http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 110m;
    }

    # Job status polling and result retrieval
    location /api/v1/documents/jobs/ {
        proxy_pass         http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
